# Netlify config (Vercel users: see vercel.json; both deploy the same site)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Redirects from the old SpotHopper URLs live in astro.config.mjs (`redirects`);
# the Netlify adapter writes them to dist/_redirects at build time.
# The two form endpoints (/api/inquiry, /api/join) are packaged as Netlify Functions by the adapter.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/happenings/*.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
